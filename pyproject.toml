
[project]
name = "lab-report-extraction"
version = "0.1.0"
description = "Lab report OCR extraction service, CPU-only"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-multipart>=0.0.32",  # required for UploadFile/Form even on FastAPI 0.141+
    # numpy/pillow are needed at import time: adapters.factory imports the
    # easy_ocr module (which uses them) eagerly, even on the mock path.
    "numpy>=2.4",
    "pillow>=12.3",
]

[project.optional-dependencies]
# The real model stack is OPTIONAL on purpose: the mock path installs and
# runs with none of it. Same philosophy as lazy-importing inside the adapter.
ocr = ["easyocr>=1.7.2"]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",       # TestClient transport
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
pythonpath = ["."]       # lets tests do `from services.config import Settings`
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pycodestyle, pyflakes, isort, pyupgrade, bugbear

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.setuptools]
packages = ["adapters", "api", "services"]
