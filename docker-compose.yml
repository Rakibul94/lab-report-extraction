services:
  api:
    build: .
    image: lab-report-extraction
    ports:
      - "${LAB_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - easyocr-models:/home/app/.EasyOCR
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  easyocr-models:
